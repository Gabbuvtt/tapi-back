version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tapi_postgres
    environment:
      POSTGRES_DB: tapi_db
      POSTGRES_USER: tapi_user
      POSTGRES_PASSWORD: tapi_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapi_user -d tapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: tapi_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: tapi_user
      MONGO_INITDB_ROOT_PASSWORD: tapi_pass
      MONGO_INITDB_DATABASE: tapi_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tapi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  mongo_data:
  redis_data:
